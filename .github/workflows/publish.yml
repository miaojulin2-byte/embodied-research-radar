name: Publish current snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml', 'DEPLOYMENT.md']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish-snapshot
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Locate static site
        id: source
        run: |
          if [ ! -f scripts/update.py ] && [ -f source-bundle.zip ]; then
            unzip -q source-bundle.zip -d /tmp/radar-publish
            rsync -a --exclude='.github' /tmp/radar-publish/embodied-radar/ ./
          fi
          echo 'directory=site' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build small home and lazy evidence data
        run: python scripts/update.py --offline
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.source.outputs.directory }}
      - uses: actions/deploy-pages@v4
        id: deployment

